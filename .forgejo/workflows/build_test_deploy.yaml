on: [push]
jobs:
  build-and-deploy:
    runs-on: docker
    container:
      image: node:24
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{secrets.CLOUDFLARE_ACCOUNT_ID}}
      CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_TOKEN}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup global tools from npm
        run: |
          npm install -g @angular/cli
          npm install -g wrangler
      - name: Build
        run: |
          cd web
          npm install
          ng build
      
      - name: Setup Test Environment
        run: |
          cd web
          npx playwright install-deps
          npx playwright install
      - name: Test
        run: |
          cd web
          ng test --no-watch --no-progress
      - name: Build and deploy to preview
        if: github.ref == 'refs/heads/dev'
        # the preview static site is seperate from the "prod" one to be able to set a custom domain
        # so we still deploy to the "prod env", but on a different service.
        run: |
          cd web
          npm run patch-webmanifest "imDCC PRE" "intermodalDCC PREVIEW"
          ng build
          npx wrangler pages deploy --project-name intermodaldcc --branch dev ./dist/web/browser/
      - name: Build and deploy to prod
        if: github.ref == 'refs/heads/main'
        run: |
          cd web
          npm run patch-webmanifest "intermodalDCC" "intermodalDCC"
          ng build
          npx wrangler pages deploy --project-name intermodaldcc --branch main ./dist/web/browser/